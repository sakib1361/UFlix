name: Build desktop

# No push/PR trigger: CI builds only when VERSION is bumped (release.yml calls this) or when run by hand (a test build,
# versioned <VERSION>-ci.<run number>, uploaded as artifacts only).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Exact release version (x.y.z); empty = <VERSION file>-ci.<run number>
        type: string
        default: ''

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ inputs.version }}
  # baked into the app as its update feed (owner/repo, read at compile time by app/src/services/updater.rs)
  UFLIX_UPDATE_REPO: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uflix
        with:
          tmdb-api-key: ${{ secrets.UFLIX_TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.UFLIX_OPENSUBTITLES_API_KEY }}
          opensubtitles-username: ${{ secrets.UFLIX_OPENSUBTITLES_USERNAME }}
          opensubtitles-password: ${{ secrets.UFLIX_OPENSUBTITLES_PASSWORD }}
          subdl-api-key: ${{ secrets.UFLIX_SUBDL_API_KEY }}

      - uses: ./.github/actions/native-deps

      - name: Package (AppImage)
        shell: bash
        run: |
          export VERSION="${RELEASE_VERSION:-$(tr -d '[:space:]' < VERSION)-ci.$GITHUB_RUN_NUMBER}"
          packaging/linux/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: uflix-linux-x64
          path: out/linux/UFlix-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-uflix
        with:
          tmdb-api-key: ${{ secrets.UFLIX_TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.UFLIX_OPENSUBTITLES_API_KEY }}
          opensubtitles-username: ${{ secrets.UFLIX_OPENSUBTITLES_USERNAME }}
          opensubtitles-password: ${{ secrets.UFLIX_OPENSUBTITLES_PASSWORD }}
          subdl-api-key: ${{ secrets.UFLIX_SUBDL_API_KEY }}

      - uses: ./.github/actions/native-deps

      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Package (Setup.exe)
        shell: pwsh
        run: |
          $v = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { "$((Get-Content VERSION -Raw).Trim())-ci.$env:GITHUB_RUN_NUMBER" }
          packaging\windows\package.ps1 -Version $v

      - uses: actions/upload-artifact@v7
        with:
          name: uflix-win-x64
          path: out/windows/UFlix-win-Setup.exe
          if-no-files-found: error
