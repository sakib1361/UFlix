name: Natives

# Run by hand (Actions → Natives → Run workflow) to make a new native set: builds the Linux libmpv from source (nvdec +
# VA-API zero-copy for the OpenGL render API), fetches the newest Windows libmpv, publishes them as the prerelease
# natives-<run number> and pins it in Native/natives.lock (committed back). App builds only download the pinned set, so run
# this when mpv, FFmpeg or Native/ change.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: natives
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Build libmpv (Ubuntu 24.04 rootfs, bubblewrap)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          WORK="$RUNNER_TEMP/mpv-linux" bash Native/mpv/build-linux.sh


      - name: Pack
        run: bash Native/natives.sh pack linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: natives-linux-x64
          path: out/natives/natives-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Fetch libmpv (newest zhongfly/mpv-winbuild LGPL build)
        shell: bash
        run: bash Native/mpv/fetch-windows.sh


      - name: Pack
        shell: bash
        run: bash Native/natives.sh pack win-x64

      - uses: actions/upload-artifact@v7
        with:
          name: natives-win-x64
          path: out/natives/natives-win-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the prerelease and pin it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: natives-${{ github.run_number }}
        run: |
          {
            echo "Native library bundled with UFlix (libmpv). Not an app release: builds download this set through Native/natives.lock."
            for f in dist/natives-*.tar.gz; do
              echo; echo "## $(basename "$f")"; echo; echo "sha256: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
              for b in $(tar -tzf "$f" | grep 'BUILDINFO.txt$'); do echo; echo '```'; tar -xzOf "$f" "$b"; echo '```'; done
            done
          } > notes.md
          gh release create "$TAG" dist/natives-*.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Native libraries ($TAG)" --notes-file notes.md

          sed -i -e "s|^NATIVES_REPO=.*|NATIVES_REPO=$GITHUB_REPOSITORY|" -e "s|^NATIVES_TAG=.*|NATIVES_TAG=$TAG|" \
                 -e "s|^SHA256_linux_x64=.*|SHA256_linux_x64=$(sha256sum dist/natives-linux-x64.tar.gz | cut -d' ' -f1)|" \
                 -e "s|^SHA256_win_x64=.*|SHA256_win_x64=$(sha256sum dist/natives-win-x64.tar.gz | cut -d' ' -f1)|" \
                 Native/natives.lock
          cat Native/natives.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Pin native libraries $TAG"
          git push
