name: UFlix native libraries
description: >
  Downloads the native set pinned in Native/natives.lock (libmpv, the assets of this repo's natives-N prerelease),
  checks its sha256 and unpacks it into the runtimes/ folders. The set itself is made by the Natives workflow.

runs:
  using: composite
  steps:
    - name: Fetch native libraries
      shell: bash
      run: bash Native/natives.sh fetch ${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}
