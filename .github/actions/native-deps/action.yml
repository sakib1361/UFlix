name: UFlix native libraries
description: >
  Puts the native libraries the app bundles in place; none of them are committed. libmpv is downloaded (Windows) or built
  from source (Linux, upstream ships no binaries), tsdl is built from Native/. Each is cached on the hash of what produces it,
  so a rebuild only happens when that changes.

runs:
  using: composite
  steps:
    # ---- libmpv ----
    - name: Cache libmpv
      id: mpv
      uses: actions/cache@v4
      with:
        path: UFlix.Cross/runtimes/${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}/native
        key: libmpv-${{ runner.os }}-${{ hashFiles(runner.os == 'Windows' && 'Native/mpv/fetch-windows.sh' || 'Native/mpv/build-linux.sh') }}

    - name: Fetch libmpv (Windows)
      if: runner.os == 'Windows' && steps.mpv.outputs.cache-hit != 'true'
      shell: bash
      run: bash Native/mpv/fetch-windows.sh

    - name: Build libmpv (Linux)
      if: runner.os == 'Linux' && steps.mpv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
        # Ubuntu 24.04 blocks unprivileged user namespaces, which bwrap needs
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        WORK="$RUNNER_TEMP/mpv-linux" bash Native/mpv/build-linux.sh

    # ---- tsdl ----
    - name: Cache tsdl
      id: tsdl
      uses: actions/cache@v4
      with:
        path: Engines/NativeRunner/runtimes/${{ runner.os == 'Windows' && 'win-x64' || 'linux-x64' }}/native
        key: tsdl-${{ runner.os }}-${{ hashFiles('Native/TorrentSharp/**', 'Native/CMakeLists.txt', 'Native/CMakePresets.json', 'Native/vcpkg.json', 'Native/triplets/**', runner.os == 'Windows' && 'Native/build-windows.ps1' || 'Native/build-linux.sh') }}

    - name: Cache vcpkg packages
      if: steps.tsdl.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: Native/build/vcpkg-cache
        key: vcpkg-${{ runner.os }}-${{ hashFiles('Native/vcpkg.json', 'Native/triplets/**') }}

    - name: Build tsdl (Linux, ubuntu:22.04 for the glibc 2.35 floor)
      if: runner.os == 'Linux' && steps.tsdl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p Native/build/vcpkg-cache
        docker run --rm -v "$PWD":/src ubuntu:22.04 /src/Native/build-linux.sh
        sudo chown -R "$(id -u):$(id -g)" Native/build Engines/NativeRunner/runtimes

    - name: Build tsdl (Windows)
      if: runner.os == 'Windows' && steps.tsdl.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
        git clone -q https://github.com/microsoft/vcpkg $vcpkg   # full clone: vcpkg.json pins a builtin-baseline commit
        & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
        $env:VCPKG_ROOT = $vcpkg
        $env:VCPKG_DEFAULT_BINARY_CACHE = Join-Path $env:GITHUB_WORKSPACE 'Native\build\vcpkg-cache'
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        & (Join-Path $env:GITHUB_WORKSPACE 'Native\build-windows.ps1')
