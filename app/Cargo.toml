[package]
name = "uflix"
description = "UFlix: movies, shows, torrents, YouTube and live TV on mpv, with a Slint UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine = { path = "../crates/engine" }
mpv = { path = "../crates/mpv" }
torrent = { path = "../crates/torrent" }
slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow = "1"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
open = "5"
rfd = "0.18"
sha2 = "0.10"

# D-Bus for keep-awake (screen saver / portal inhibit)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[build-dependencies]
slint-build = "1.18"
