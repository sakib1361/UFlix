[package]
name = "engine"
description = "UI-free core of UFlix: models, settings/cache store, TMDB, catalogues, torrent and subtitle search, YouTube, IPTV"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
regex.workspace = true
chrono.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
directories = "6"
md5 = "0.8"
scraper = "0.29"
zip = { version = "9", default-features = false, features = ["deflate"] }
html-escape = "0.3"
urlencoding = "2"
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-native-roots"] }
futures = "0.3"
