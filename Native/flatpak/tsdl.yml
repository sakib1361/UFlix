# DRAFT Flatpak module for libtsdl.so (doc/CrossPlatformDev.md) — not built yet.
# Include it from the app manifest:   modules: [ Native/flatpak/tsdl.yml ]
# Flatpak builds have no network, so vcpkg is not used: Boost and libtorrent are built here from
# pinned archives as static PIC libraries and folded into libtsdl.so; OpenSSL comes from
# org.freedesktop.Platform (dynamic, fine inside the sandbox).
# The app finds the library with TSDL_LIB=/app/lib/libtsdl.so (NativeTS resolver) or by
# copying it next to the app. Finish args the app needs: --share=network,
# --filesystem=xdg-download/UFlix:create (or a portal-chosen folder).
name: tsdl
buildsystem: cmake-ninja
builddir: true
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DTSDL_USE_VCPKG=OFF
  - -DTSDL_SYSTEM_LIBTORRENT=ON
  - -DTSDL_INSTALL_DIR=lib
sources:
  - type: dir
    path: ..
    skip:
      - build
modules:
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=system
      - ./b2 -j $FLATPAK_BUILDER_N_JOBS install variant=release link=static threading=multi cxxflags=-fPIC cflags=-fPIC
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.88.0/source/boost_1_88_0.tar.bz2
        sha256: 46d9d2c06637b219270877c9e16155cbd015b6dc84349af064c088e9b5b12f7b

  - name: libtorrent-rasterbar
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DCMAKE_CXX_STANDARD=17
      - -Ddeprecated-functions=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/arvidn/libtorrent/releases/download/v2.0.11/libtorrent-rasterbar-2.0.11.tar.gz
        sha256: f0db58580f4f29ade6cc40fa4ba80e2c9a70c90265cd77332d3cdec37ecf1e6d
